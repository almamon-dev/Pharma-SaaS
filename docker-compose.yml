services:
  app:
    build:
      context: .
      dockerfile: infra/docker/php/Dockerfile
    image: pharmacy-saas-app:latest
    container_name: pharmacy-saas-app
    working_dir: /workspace/apps/pharmacy-api
    volumes:
      - ./:/workspace
      - ./infra/docker/php/php.ini:/usr/local/etc/php/conf.d/custom.ini
    ports:
      - "8001:8000"
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      bash -c "
        if [ ! -d vendor ]; then composer install --no-interaction; fi &&
        php artisan migrate --force &&
        php artisan serve --host=0.0.0.0 --port=8000
      "

  postgres:
    image: postgres:16-alpine
    container_name: pharmacy-saas-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: pharmacy_saas
      POSTGRES_USER: pharmacy
      POSTGRES_PASSWORD: secret
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pharmacy -d pharmacy_saas"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: pharmacy-saas-redis
    restart: unless-stopped
    ports:
      - "6388:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  redisdata:
